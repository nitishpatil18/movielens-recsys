# usage:
#   docker compose up -d         # start the service in background
#   docker compose logs -f       # follow logs
#   docker compose down          # stop and remove

services:
  recsys-api:
    image: movielens-recsys:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recsys-api
    ports:
      - "8000:8000"
    volumes:
      # mount the local parquet data directory read-only
      - ./data/parquet:/data/parquet:ro
    environment:
      RECSYS_DATA_DIR: /data/parquet
      RECSYS_CKPT_DIR: /app/checkpoints
      OMP_NUM_THREADS: "1"
      KMP_DUPLICATE_LIB_OK: "TRUE"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
