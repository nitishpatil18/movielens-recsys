# usage:
#   docker compose up -d         # start api + prometheus + grafana
#   docker compose logs -f       # follow logs
#   docker compose down          # stop and remove

services:
  recsys-api:
    image: movielens-recsys:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recsys-api
    ports:
      - "8000:8000"
    volumes:
      - ./data/parquet:/data/parquet:ro
      - ./drift_artifacts:/serving_logs
    environment:
      RECSYS_DATA_DIR: /data/parquet
      RECSYS_CKPT_DIR: /app/checkpoints
      OMP_NUM_THREADS: "1"
      KMP_DUPLICATE_LIB_OK: "TRUE"
      RECSYS_SERVING_LOG: /serving_logs/serving_features.jsonl
      RECSYS_SERVING_LOG_RATE: "0.10"
      RECSYS_EXPERIMENT_ENABLED: "true"
      RECSYS_EXPERIMENT: "ranker_vs_no_ranker"
      RECSYS_VARIANT_A_PCT: "50"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: recsys-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    depends_on:
      recsys-api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    container_name: recsys-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
